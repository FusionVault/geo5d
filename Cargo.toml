# geo5d — the geopotential & relativistic dimension of geodesy, in pure f64.
#
# Where geo3d answers "where" (frames) and geo4d answers
# "when" (time), geo5d answers how gravity and relativity warp both: normal gravity and geopotential,
# height systems, chronometric leveling (clock frequency ↔ geopotential ↔ height), and the
# relativistic clock-rate layer. Pure formulas, no data; absolute geopotential is bring-your-own via
# a model, exactly as geo3d's ellipsoid is a value you pass in.
#
# Package metadata is pinned here rather than inherited from a workspace so the crate publishes
# unchanged from its own repository.
[package]
name = "geo5d"
version = "0.5.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Gravity and relativity for geodesy: normal gravity, heights from the geopotential, spherical-harmonic gravity models, and clocks as height meters (chronometric levelling)."
repository = "https://github.com/FusionVault/geo5d"
readme = "README.md"
documentation = "https://docs.rs/geo5d"
keywords = ["geodesy", "relativity", "geopotential", "gravity", "clocks"]
categories = ["science::geo", "aerospace", "mathematics"]
exclude = [".github/", ".gitignore", "rustfmt.toml"]

[dependencies]
# The lower layers: geo4d re-exports geo3d, so geo5d gets frames + time from one dependency.
geo4d = "0.1.1"
# Spherical-harmonic synthesis (Legendre functions, partials to second order).
geopotential = "0.1.1"
# Optional: `Serialize`/`Deserialize` on the public types.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "geo4d/serde", "geopotential/serde"]

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
